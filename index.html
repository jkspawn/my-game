<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>청사 스네이크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Silkscreen&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app">
  <header class="top">
    <h1><span class="seal">蛇</span>청사 스네이크</h1>
    <div id="status" class="status ready"><i></i><span id="statusText">준비</span></div>
  </header>

  <section class="hud">
    <div class="stat"><label>점수</label><strong id="score">0</strong></div>
    <div class="stat"><label>최고</label><strong id="best">0</strong></div>
    <div class="stat"><label>길이</label><strong id="length">3</strong></div>
    <div class="stat foe"><label>장애물 뱀</label><strong id="foes">1</strong></div>
  </section>

  <div class="next"><span id="nextText">다음 장애물 뱀까지 500점</span><div class="bar"><div id="nextBar"></div></div></div>

  <div id="boardWrap" data-state="ready">
    <canvas id="board"></canvas>
    <div id="toast" class="toast hidden"></div>

    <div id="overlay" class="overlay">
      <div id="startPanel" class="panel">
        <h2>청사 스네이크</h2>
        <p>알을 먹을수록 몸이 길어지고 점수가 올라요.
          500점마다 장애물 뱀이 한 마리씩 늘어나요.
          벽·다른 뱀·내 몸에 닿으면 끝!</p>
        <button id="startBtn" class="btn">시작하기</button>
      </div>

      <div id="pausePanel" class="panel hidden">
        <h2>일시정지</h2>
        <p>잠시 숨을 고르세요.</p>
        <button id="resumeBtn" class="btn">계속하기</button>
      </div>

      <div id="overPanel" class="panel hidden">
        <h2 class="over-title">게임 오버</h2>
        <p id="overReason">벽에 부딪혔어요</p>
        <div class="big" id="overScore">0</div>
        <span id="overRecord" class="record hidden">신기록!</span>
        <dl class="result">
          <dt>길이</dt><dd id="overLength">3</dd>
          <dt>장애물 뱀</dt><dd id="overFoes">1</dd>
          <dt>흰 알</dt><dd id="overWhite">0</dd>
          <dt>연두 알</dt><dd id="overLime">0</dd>
          <dt>노란 알</dt><dd id="overGold">0</dd>
          <dt>최고 기록</dt><dd id="overBest">0</dd>
        </dl>
        <button id="retryBtn" class="btn">다시하기</button>
      </div>
    </div>
  </div>

  <ul class="legend">
    <li><canvas data-egg="0" width="24" height="24"></canvas>흰 알 <b>10</b></li>
    <li><canvas data-egg="1" width="24" height="24"></canvas>연두 알 <b>25</b></li>
    <li><canvas data-egg="2" width="24" height="24"></canvas>노란 알 <b>50</b></li>
  </ul>

  <div class="controls">
    <div class="dpad">
      <button class="pad up" data-dir="up" aria-label="위">▲</button>
      <button class="pad left" data-dir="left" aria-label="왼쪽">◀</button>
      <button class="pad down" data-dir="down" aria-label="아래">▼</button>
      <button class="pad right" data-dir="right" aria-label="오른쪽">▶</button>
    </div>
    <button id="pauseBtn" class="pad pause" aria-label="일시정지">Ⅱ</button>
  </div>

  <p class="keys"><kbd>←↑↓→</kbd> / <kbd>WASD</kbd> 이동 · <kbd>Space</kbd> <kbd>P</kbd> 일시정지 · <kbd>Enter</kbd> 시작</p>
</main>
<script src="script.js"></script>
</body>
</html>
